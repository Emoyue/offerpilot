# =============================================================================
# OfferPilot - 站点配置（同域三分区）
#   /        学员端 portal-web 静态产物   → /usr/share/nginx/portal
#   /admin/  管理端 admin-web 静态产物    → /usr/share/nginx/admin
#   /api/    后端 Spring Boot             → 127.0.0.1:8080（保留 /api 前缀）
#
# 静态目录布局（两套产物平级）：
#   /usr/share/nginx/portal/index.html
#   /usr/share/nginx/admin/index.html
#
# 多域名部署：把本文件复制成 portal.conf / admin.conf，各自写 server_name 即可。
# =============================================================================

upstream yszx_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    # 学员端为站点根，管理端在其下的 /admin 子目录
    root  /usr/share/nginx/portal;
    index index.html;

    # 安全响应头（不含业务鉴权，鉴权在后端）
    add_header X-Content-Type-Options   "nosniff"          always;
    add_header X-Frame-Options          "SAMEORIGIN"       always;
    add_header Referrer-Policy          "same-origin"      always;

    # ---------------------------------------------------------------- 入口页
    # index.html 不缓存，避免发版后用户仍拿到旧壳子
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /admin/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        root /usr/share/nginx;
        try_files $uri =404;
    }

    # ------------------------------------------------------------ 学员端（SPA）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------ 管理端（SPA）
    # 用 root 而非 alias：/admin/x → /usr/share/nginx/admin/x
    location /admin/ {
        root /usr/share/nginx;
        try_files $uri $uri/ /admin/index.html;
    }

    # -------------------------------------------------------------- 静态资源缓存
    # Vite 产物带内容哈希，可长缓存
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp|mp4)$ {
        root /usr/share/nginx;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------- 后端 API
    # 后端接口本身就带 /api/portal/v1 与 /api/admin/v1 前缀（04 文档 §1），
    # 故 proxy_pass 不带 URI，原样透传。
    location /api/ {
        proxy_pass         http://yszx_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout  5s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;   # 普通 JSON 接口
    }

    # ------------------------------------------------------------------ SSE 流式
    # D19：AI 批改 + 面试逐题评分走 SSE（04 文档 2.9）
    #   P-I03  POST /api/portal/v1/interview/sessions/{id}/answers
    #   简答批改的独立评分接口（04 文档 P-P02 规则②，路径以最终实现为准，
    #   若后端定为 /practice/{id}/grade-stream，改下面这一行正则即可）
    location ~* ^/api/portal/v1/(interview/sessions/[^/]+/answers|practice/[^/]+/grade(-stream)?)$ {
        proxy_pass         http://yszx_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 关闭一切缓冲，事件立刻到达前端（打字机效果的前提）
        proxy_buffering      off;
        proxy_cache          off;
        proxy_request_buffering off;
        gzip                 off;
        chunked_transfer_encoding on;

        # 单题回答上限 5 分钟（需求 3.8.1），读超时须大于该值
        proxy_connect_timeout 5s;
        proxy_send_timeout    360s;
        proxy_read_timeout    360s;
    }

    # ------------------------------------------------------------------ 其它
    # 健康检查（后端暴露 /actuator/health 时可直接探活）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 隐藏文件与大目录兜底
    location ~ /\.(?!well-known) {
        deny all;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/portal;
        internal;
    }
}
