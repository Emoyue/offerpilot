# =============================================================================
# OfferPilot - Nginx 主配置
# 用途：统一入口（/ 学员端、/admin 管理端、/api 后端），见 02 文档 2.4 同域分区（D20）
#
# 部署位置：容器内 /etc/nginx/nginx.conf，站点配置在 conf.d/site.conf
# 若在宿主机用 apt/yum 安装的 nginx，把 user 改成 www-data（Debian/Ubuntu）
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 记录上游耗时，便于定位 AI 接口慢的问题
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # 上传体积上限：题库 Excel 导入、面试题文档解析、头像/Logo（单文件最大 50MB）
    client_max_body_size 50m;
    client_body_timeout  60s;
    client_header_timeout 30s;

    # 压缩：注意 text/event-stream 不参与压缩，SSE 路径另有关闭配置
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
